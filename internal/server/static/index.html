<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>gTorrent</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-dot"></div>
        <div>
          <h1>gTorrent</h1>
          <p>rTorrent Remote Client</p>
        </div>
      </div>
      <div class="topbar-right">
        <div id="global-stats" class="global-stats">0 torrents</div>
        <div class="status-pill" id="status">Connecting</div>
      </div>
    </header>

    <section class="toolbar card">
      <form id="add-form" class="add-form">
        <label class="field magnet-field" for="magnet">
          <span>Magnet</span>
          <input type="url" id="magnet" name="magnet" placeholder="magnet:?xt=urn:btih:...">
        </label>
        <label class="field file-field" for="torrent">
          <span>.torrent</span>
          <input type="file" id="torrent" name="torrent" accept=".torrent,application/x-bittorrent">
        </label>
        <button type="submit" id="add-btn">Add</button>
      </form>
      <div class="toolbar-actions">
        <button type="button" id="remove-selected" class="danger" disabled>Remove Selected</button>
        <button type="button" id="refresh" class="secondary">Refresh</button>
      </div>
      <p id="form-message" class="message" role="status" aria-live="polite"></p>
    </section>

    <section class="content-grid">
      <aside class="sidebar card">
        <h2>Views</h2>
        <div class="filter-list" id="filters">
          <button type="button" data-filter="all" class="active">All</button>
          <button type="button" data-filter="downloading">Downloading</button>
          <button type="button" data-filter="seeding">Seeding</button>
          <button type="button" data-filter="complete">Complete</button>
          <button type="button" data-filter="stopped">Stopped</button>
        </div>
      </aside>

      <section class="main-panel card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th><button type="button" class="sort-btn" data-sort="name">Name</button></th>
                <th><button type="button" class="sort-btn" data-sort="state">State</button></th>
                <th><button type="button" class="sort-btn" data-sort="progress">Done</button></th>
                <th><button type="button" class="sort-btn" data-sort="downRate">Down</button></th>
                <th><button type="button" class="sort-btn" data-sort="upRate">Up</button></th>
                <th><button type="button" class="sort-btn" data-sort="sizeBytes">Size</button></th>
              </tr>
            </thead>
            <tbody id="torrents-body">
              <tr><td colspan="6" class="placeholder">No torrents</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>

    <section class="details card">
      <div class="details-header">
        <h2>Details</h2>
        <span id="details-state" class="state-chip">None</span>
      </div>
      <div id="details-empty" class="details-empty">Select a torrent to view details</div>
      <div id="details-content" class="details-content hidden">
        <h3 id="details-name"></h3>
        <p id="details-hash" class="hash"></p>
        <div class="details-progress">
          <progress id="details-progress" max="1" value="0"></progress>
          <span id="details-progress-text">0%</span>
        </div>
        <div class="metrics">
          <div><span>Downloaded</span><strong id="details-downloaded">0 B</strong></div>
          <div><span>Total Size</span><strong id="details-size">0 B</strong></div>
          <div><span>Down Rate</span><strong id="details-down-rate">0 B/s</strong></div>
          <div><span>Up Rate</span><strong id="details-up-rate">0 B/s</strong></div>
        </div>
      </div>
    </section>
  </main>

  <template id="row-template">
    <tr>
      <td class="name"></td>
      <td><span class="state"></span></td>
      <td>
        <div class="progress-wrap">
          <progress class="progress" max="1" value="0"></progress>
          <span class="percent"></span>
        </div>
      </td>
      <td class="down"></td>
      <td class="up"></td>
      <td class="size"></td>
    </tr>
  </template>

  <script type="module" src="/app.js"></script>
</body>
</html>
